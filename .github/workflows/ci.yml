name: CI

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test tests/*.test.mjs

  monkeyc:
    runs-on: ubuntu-latest
    if: ${{ vars.CONNECTIQ_DEVICES_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile fenix7
        run: ./scripts/build.sh fenix7
